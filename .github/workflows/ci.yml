name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: phanda
          POSTGRES_USER: phanda
          POSTGRES_PASSWORD: phanda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phanda -d phanda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://phanda:phanda@localhost:5432/phanda
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-for-production-use-only
      ENVIRONMENT: development
      # Both integration suites are opt-in by default (see their module
      # docstrings) precisely so they can run here, against real service
      # containers, without needing them in every contributor's sandbox.
      PHANDA_RUN_POSTGRES_INTEGRATION: "1"
      PHANDA_RUN_REDIS_CELERY_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q app tests scripts migrations

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Run the full test suite
        run: python -m unittest discover -v
