services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phanda
      POSTGRES_USER: phanda
      POSTGRES_PASSWORD: phanda
    ports:
      # Keep the container on 5432; 5433 avoids the local Windows PostgreSQL service.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phanda -d phanda"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations, then exits. api/worker/beat wait for this
  # to succeed rather than each racing to migrate on startup.
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://phanda:phanda@postgres:5432/phanda
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://phanda:phanda@postgres:5432/phanda
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    # Shared with worker: without S3 configured, CV uploads (api) and CV
    # extraction/tailoring (worker) both read/write local storage -- as
    # separate containers they have separate filesystems, so without this
    # volume the worker gets FileNotFoundError for every file the api ever
    # wrote (verified: a real CV upload failed extraction with exactly that
    # error until this was added). Only relevant when S3_BUCKET is unset;
    # production should configure S3 instead of relying on this volume.
    volumes:
      - phanda_storage:/app/.phanda-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://phanda:phanda@postgres:5432/phanda
      REDIS_URL: redis://redis:6379/0
    volumes:
      - phanda_storage:/app/.phanda-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build: .
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://phanda:phanda@postgres:5432/phanda
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  phanda_storage:
